<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADE — Обменивай. Не покупай.</title>
<style>
:root{
  --bg:#f5f5f7; --bg2:#ffffff; --text:#111; --muted:#777; --line:#e5e5ea;
  --accent:#111; --accent-text:#fff; --card:#fff; --chip:#fff; --shadow:#0001;
  --chat-me:#111; --chat-me-text:#fff; --chat-other:#ececf1;
}
[data-theme="dark"]{
  --bg:#0e0e11; --bg2:#17171c; --text:#f2f2f7; --muted:#9a9aa5; --line:#2a2a33;
  --accent:#f2f2f7; --accent-text:#111; --card:#17171c; --chip:#1e1e26; --shadow:#0008;
  --chat-me:#f2f2f7; --chat-me-text:#111; --chat-other:#26262f;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
header{background:var(--bg2);color:var(--text);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:900;letter-spacing:2px}
header button{background:none;border:0;color:var(--text);cursor:pointer;margin-left:8px;font-size:14px;padding:8px;border-radius:8px}
header button:hover{background:var(--line)}
.hero{background:var(--bg2);color:var(--text);padding:45px 5% 55px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(36px,6vw,68px);line-height:.98;margin:0 0 16px}
.hero p{max-width:650px;color:var(--muted);font-size:17px;line-height:1.5}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:28px}
.stat b{display:block;font-size:23px}
.stat span{color:var(--muted);font-size:13px}
.controls{background:var(--bg);padding:18px 5%;position:sticky;top:58px;z-index:5;border-bottom:1px solid var(--line)}
.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--bg2);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--text);font-size:14px;cursor:pointer}
.chips{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:4px}
.chip{padding:9px 15px;border:1px solid var(--line);background:var(--chip);border-radius:20px;white-space:nowrap;cursor:pointer;color:var(--text);font-size:14px}
.chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{padding:26px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 4px 18px var(--shadow);cursor:pointer;transition:.2s;color:var(--text)}
.card:hover{transform:translateY(-3px)}
.photo{height:210px;position:relative;background:#ddd}
.photo img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;cursor:pointer}
.body{padding:14px}
.body h3{margin:0 0 6px;font-size:16px}
.meta{font-size:12.5px;color:var(--muted)}
.want{font-size:13.5px;margin-top:10px}
.money{font-weight:bold;margin-top:8px;font-size:14px}
.add{position:fixed;right:22px;bottom:22px;background:var(--accent);color:var(--accent-text);border:0;border-radius:30px;padding:15px 20px;font-weight:bold;cursor:pointer;z-index:20;box-shadow:0 6px 20px var(--shadow)}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:var(--bg2);color:var(--text);border-radius:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
.close{position:absolute;right:14px;top:14px;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;background:var(--line);color:var(--text);font-size:18px}
.detailimg{width:100%;height:340px;object-fit:cover;border-radius:14px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.thumbs img.active{border-color:var(--accent)}
.btn{padding:12px 16px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-text);font-weight:bold;cursor:pointer;margin:8px 8px 0 0;font-size:14px}
.btn.light{background:var(--line);color:var(--text)}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px;font-size:14px;background:var(--bg2);color:var(--text)}
.chat{padding:10px 14px;background:var(--chat-other);border-radius:14px;margin:6px 0;max-width:75%;font-size:14px}
.chat.me{background:var(--chat-me);color:var(--chat-me-text);margin-left:auto}
.chatwrap{max-height:280px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;display:flex;flex-direction:column}
.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:12px 18px;border-radius:12px;z-index:100;font-size:14px;box-shadow:0 6px 20px var(--shadow)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--text);cursor:pointer;font-size:14px}
.tab.active{background:var(--accent);color:var(--accent-text)}
.trade{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px var(--shadow)}
.stars{cursor:pointer;font-size:22px;color:#f59e0b;letter-spacing:2px;user-select:none}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:15px}
.upload{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;margin:6px 0 12px}
.upload:hover{border-color:var(--accent)}
.preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.preview img{width:70px;height:70px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>

<header>
  <div class="logo">TRADE</div>
  <div>
    <button onclick="openProfile()">Профиль</button>
    <button onclick="openChat()">💬 Чат</button>
    <button onclick="toggleTheme()" id="themeBtn">🌙 Тема</button>
  </div>
</header>

<section class="hero">
  <h1>Обменивай.<br>Не покупай.</h1>
  <p>Маркетплейс, где вещи находят новых владельцев. Предлагай обмен, договаривайся и добавляй доплату, если стоимость отличается.</p>
  <div class="stats">
    <div class="stat"><b id="stItems">0</b><span>объявлений</span></div>
    <div class="stat"><b id="stTrades">0</b><span>обменов</span></div>
    <div class="stat"><b>4.8 ⭐</b><span>средний рейтинг</span></div>
    <div class="stat"><b>37</b><span>новых сегодня</span></div>
  </div>
</section>

<section class="controls">
  <input id="search" class="search" placeholder="🔎 Найти товар, описание или желаемый обмен..." oninput="render()">
  <div class="filters">
    <select id="condFilter" onchange="render()">
      <option value="">Любое состояние</option>
      <option>Новое</option><option>Отличное</option><option>Хорошее</option><option>С дефектами</option>
    </select>
    <select id="moneyFilter" onchange="render()">
      <option value="">Любая доплата</option>
      <option value="yes">Только с доплатой</option>
      <option value="no">Без доплаты</option>
    </select>
    <select id="sort" onchange="render()">
      <option value="new">Сначала новые</option>
      <option value="rating">По рейтингу</option>
      <option value="name">По названию</option>
    </select>
    <button class="chip" onclick="showFav()">❤️ Избранное</button>
  </div>
  <div id="chips" class="chips"></div>
</section>

<main id="grid" class="grid"></main>
<button class="add" onclick="addModal()">＋ Добавить товар</button>

<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- Реальные фото (Unsplash) ---------- */
const photos={
  iphone:"https://images.unsplash.com/photo-1592286927505-2fd2e6e6f7b2?auto=format&fit=crop&w=900&q=85",
  nike:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85",
  camera:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=900&q=85",
  bike:"https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=900&q=85",
  books:"https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=900&q=85",
  ps5:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=900&q=85",
  coffee:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=85",
  backpack:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=85",
  guitar:"https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&w=900&q=85",
  laptop:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=85",
  watch:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85",
  skate:"https://images.unsplash.com/photo-1547447134-cd3f5c716030?auto=format&fit=crop&w=900&q=85"
};

/* ---------- Данные по умолчанию ---------- */
const defaultItems=[
  {id:1,title:"iPhone 13",cat:"Электроника",owner:"Максим",rating:4.9,views:127,photos:[photos.iphone],cond:"Хорошее",want:"iPhone 14 / AirPods",money:"Доплата: 5 000 ₽",desc:"Аккуратный, без сколов, батарея 89%.",mine:false},
  {id:2,title:"Nike Air Max",cat:"Одежда",owner:"Алина",rating:4.8,views:89,photos:[photos.nike],cond:"Отличное",want:"Кроссовки Adidas / худи",money:"Без доплаты",desc:"42 размер, носил пару раз.",mine:false},
  {id:3,title:"Sony Alpha",cat:"Электроника",owner:"Дмитрий",rating:5,views:74,photos:[photos.camera],cond:"Отличное",want:"Объектив Sony / MacBook",money:"Доплата обсуждается",desc:"Полный комплект, чехол и ремень.",mine:false},
  {id:4,title:"Велосипед Trek",cat:"Спорт",owner:"Иван",rating:4.7,views:156,photos:[photos.bike],cond:"Хорошее",want:"Горный велосипед другого размера",money:"Доплата: 10 000 ₽",desc:"Рама L, обслужен.",mine:false},
  {id:5,title:"Гарри Поттер (комплект)",cat:"Книги",owner:"Мария",rating:4.9,views:53,photos:[photos.books],cond:"Хорошее",want:"Фантастика / комиксы",money:"Без доплаты",desc:"Все 7 книг, читались один раз.",mine:false},
  {id:6,title:"PlayStation 5",cat:"Электроника",owner:"Сергей",rating:4.9,views:201,photos:[photos.ps5],cond:"Отличное",want:"MacBook / Xbox Series X",money:"Доплата обсуждается",desc:"Дисковод, 2 геймпада.",mine:false},
  {id:7,title:"Кофемашина De'Longhi",cat:"Дом",owner:"Ольга",rating:4.6,views:42,photos:[photos.coffee],cond:"Хорошее",want:"Робот-пылесос",money:"Доплата: 3 000 ₽",desc:"Работает идеально, есть капучинатор.",mine:false},
  {id:8,title:"Рюкзак Nike",cat:"Одежда",owner:"Никита",rating:4.8,views:31,photos:[photos.backpack],cond:"Отличное",want:"Другой городской рюкзак",money:"Без доплаты",desc:"Вмещает ноутбук 15''.",mine:false},
  {id:9,title:"Гитара Yamaha",cat:"Другое",owner:"Артём",rating:4.7,views:64,photos:[photos.guitar],cond:"Хорошее",want:"Синтезатор / микрофон",money:"Без доплаты",desc:"Акустическая, звук отличный.",mine:false},
  {id:10,title:"MacBook Air M1",cat:"Электроника",owner:"Егор",rating:5,views:310,photos:[photos.laptop],cond:"Отличное",want:"iPad Pro / Windows-ноутбук",money:"Доплата: 15 000 ₽",desc:"8/256, цикл 120.",mine:false},
  {id:11,title:"Часы Casio",cat:"Другое",owner:"Павел",rating:4.8,views:22,photos:[photos.watch],cond:"Новое",want:"Фитнес-браслет",money:"Без доплаты",desc:"Не носились, коробка есть.",mine:false},
  {id:12,title:"Скейтборд",cat:"Спорт",owner:"Лена",rating:4.6,views:18,photos:[photos.skate],cond:"Хорошее",want:"Ролики / самокат",money:"Без доплаты",desc:"Доска 8.0, подвески целые.",mine:false}
];

/* ---------- Хранилище ---------- */
const LS={
  get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch{return d}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};
let items=LS.get("tradeItems",defaultItems);
let favorites=new Set(LS.get("tradeFav",[]));
let trades=LS.get("tradeTrades",[]);
let chatHistory=LS.get("tradeChat",[
  {with:"Максим",me:false,text:"Привет! Интересует твой iPhone 👋"},
  {with:"Максим",me:true,text:"Могу предложить AirPods + доплату."}
]);
let ratings=LS.get("tradeRatings",{});
let currentItem=null;
let currentChat="Максим";

const cats=["Все","Электроника","Одежда","Книги","Спорт","Дом","Другое"];
let cat="Все";

/* ---------- Тема ---------- */
function applyTheme(t){
  const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const eff=t==="auto"?(sysDark?"dark":"light"):t;
  document.documentElement.setAttribute("data-theme",eff);
  document.getElementById("themeBtn").textContent=eff==="dark"?"☀️ Тема":"🌙 Тема";
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme")||"light";
  const next=cur==="dark"?"light":"dark";
  LS.set("tradeTheme",next);applyTheme(next);
}
applyTheme(LS.get("tradeTheme","light"));

/* ---------- Экранирование ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- Рендер каталога ---------- */
function renderChips(){
  document.getElementById("chips").innerHTML=cats.map(c=>
    `<button class="chip ${c===cat?'active':''}" onclick="cat='${c}';renderChips();render()">${c}</button>`
  ).join("");
}
function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const cond=document.getElementById("condFilter").value;
  const money=document.getElementById("moneyFilter").value;
  const sort=document.getElementById("sort").value;

  let list=items.filter(x=>{
    if(cat!=="Все"&&x.cat!==cat)return false;
    if(cond&&x.cond!==cond)return false;
    if(money==="yes"&&!/доплат/i.test(x.money))return false;
    if(money==="no"&&/доплат/i.test(x.money))return false;
    const hay=(x.title+" "+x.desc+" "+x.want+" "+x.owner).toLowerCase();
    return hay.includes(q);
  });

  if(sort==="rating")list=[...list].sort((a,b)=>b.rating-a.rating);
  else if(sort==="name")list=[...list].sort((a,b)=>a.title.localeCompare(b.title));
  else list=[...list].sort((a,b)=>b.id-a.id);

  const grid=document.getElementById("grid");
  if(!list.length){grid.innerHTML='<div class="empty">Ничего не найдено 😕</div>';return}
  grid.innerHTML=list.map(x=>`
    <article class="card" onclick="detail(${x.id})">
      <div class="photo">
        <img src="${x.photos[0]}" alt="${esc(x.title)}" loading="lazy">
        <button class="heart" onclick="event.stopPropagation();fav(${x.id})">${favorites.has(x.id)?"❤️":"♡"}</button>
      </div>
      <div class="body">
        <h3>${esc(x.title)}</h3>
        <div class="meta">${esc(x.cat)} · ${esc(x.owner)} · ⭐ ${x.rating} · 👁 ${x.views}</div>
        <div class="want"><b>Хочу:</b> ${esc(x.want)}</div>
        <div class="money">${esc(x.money)}</div>
      </div>
    </article>`).join("");
  document.getElementById("stItems").textContent=items.length;
  document.getElementById("stTrades").textContent=trades.filter(t=>t.status==="принят").length;
}
function fav(id){
  favorites.has(id)?favorites.delete(id):favorites.add(id);
  LS.set("tradeFav",[...favorites]);render();
  toast(favorites.has(id)?"Добавлено в избранное ❤️":"Убрано из избранного");
}
function showFav(){
  if(!favorites.size){toast("В избранном пока пусто");return}
  const list=items.filter(x=>favorites.has(x.id));
  document.getElementById("grid").innerHTML=list.map(x=>`
    <article class="card" onclick="detail(${x.id})">
      <div class="photo"><img src="${x.photos[0]}" alt="${esc(x.title)}"></div>
      <div class="body"><h3>${esc(x.title)}</h3>
      <div class="meta">${esc(x.cat)} · ⭐ ${x.rating}</div>
      <div class="money">${esc(x.money)}</div></div>
    </article>`).join("");
}

/* ---------- Детальная карточка ---------- */
function detail(id){
  currentItem=items.find(i=>i.id===id);
  if(!currentItem)return;
  const x=currentItem;
  document.getElementById("content").innerHTML=`
    <img id="mainImg" class="detailimg" src="${x.photos[0]}" alt="${esc(x.title)}">
    <div class="thumbs">${x.photos.map((p,i)=>`<img src="${p}" class="${i===0?'active':''}" onclick="switchImg(${i},this)" alt="">`).join("")}</div>
    <h2 style="margin-top:14px">${esc(x.title)}</h2>
    <p style="color:var(--muted);font-size:14px">${esc(x.cat)} · Состояние: <b>${esc(x.cond)}</b></p>
    <p>👤 ${esc(x.owner)} · ⭐ <b>${x.rating}</b> · 👁 ${x.views}</p>
    <p>${esc(x.desc)}</p>
    <p><b>Ищу в обмен:</b><br>${esc(x.want)}</p>
    <p><b>${esc(x.money)}</b></p>
    <button class="btn" onclick="offerModal(${x.id})">🔄 Предложить обмен</button>
    <button class="btn light" onclick="openChat('${esc(x.owner)}','${esc(x.title)}')">💬 Написать владельцу</button>
    <button class="btn light" onclick="fav(${x.id});closeModal()">❤️ В избранное</button>`;
  openModal();
}
function switchImg(i,el){
  if(!currentItem)return;
  document.getElementById("mainImg").src=currentItem.photos[i];
  document.querySelectorAll(".thumbs img").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
}

/* ---------- Предложение обмена ---------- */
function offerModal(targetId){
  const target=items.find(i=>i.id===targetId);
  const mine=items.filter(i=>i.mine);
  const opts=mine.length
    ? mine.map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join("")
    : `<option value="">— сначала добавьте свой товар —</option>`;
  document.getElementById("content").innerHTML=`
    <h2>Предложить обмен</h2>
    <p>Вы хотите: <b>${esc(target.title)}</b> (${esc(target.owner)})</p>
    <label>Ваш товар взамен:</label>
    <select id="myItem" class="field">${opts}</select>
    <label>Доплата (₽, необязательно):</label>
    <input id="myMoney" class="field" type="number" placeholder="0">
    <label>Сообщение:</label>
    <textarea id="myMsg" class="field" rows="3" placeholder="Привет! Меняю ..."></textarea>
    <button class="btn" onclick="sendOffer(${target.id})">Отправить предложение</button>
    <button class="btn light" onclick="closeModal()">Отмена</button>`;
  openModal();
}
function sendOffer(targetId){
  const target=items.find(i=>i.id===targetId);
  const myId=document.getElementById("myItem").value;
  const mine=items.find(i=>String(i.id)===String(myId));
  if(!mine){toast("Сначала добавьте свой товар");return}
  const money=document.getElementById("myMoney").value;
  trades.unshift({
    id:crypto.randomUUID(),
    target:target.title,targetOwner:target.owner,
    my:mine.title,money:money?`+${money} ₽`:"без доплаты",
    status:"предложен",date:new Date().toLocaleString("ru")
  });
  LS.set("tradeTrades",trades);
  closeModal();toast("Предложение отправлено ✅");render();
}

/* ---------- Профиль ---------- */
function openProfile(){
  const active=trades.filter(t=>t.status==="предложен");
  const done=trades.filter(t=>t.status==="принят");
  document.getElementById("content").innerHTML=`
    <h2>Профиль</h2>
    <h3>Алексей ⭐ 4.9</h3>
    <p style="color:var(--muted)">${done.length} завершённых обменов · ${favorites.size} в избранном</p>
    <div class="tabs">
      <button class="tab active" onclick="ptab('active',this)">Активные (${active.length})</button>
      <button class="tab" onclick="ptab('done',this)">Завершённые (${done.length})</button>
      <button class="tab" onclick="ptab('settings',this)">Настройки</button>
    </div>
    <div id="ptabContent"></div>`;
  openModal();ptab('active');
}
function ptab(tab,el){
  if(el){document.querySelectorAll(".tabs .tab").forEach(t=>t.classList.remove("active"));el.classList.add("active")}
  const box=document.getElementById("ptabContent");
  if(tab==="active"){
    const list=trades.filter(t=>t.status==="предложен");
    box.innerHTML=list.length?list.map(t=>`
      <div class="trade">
        <b>${esc(t.my)} ↔ ${esc(t.target)}</b>
        <div class="meta">с ${esc(t.targetOwner)} · ${esc(t.money)} · ${esc(t.date)}</div>
        <div style="margin-top:8px">
          <button class="btn" onclick="setTrade('${t.id}','принят')">Принять</button>
          <button class="btn light" onclick="setTrade('${t.id}','отклонён')">Отклонить</button>
        </div>
      </div>`).join(""):'<div class="empty">Нет активных предложений</div>';
  } else if(tab==="done"){
    const list=trades.filter(t=>t.status==="принят");
    box.innerHTML=list.length?list.map(t=>`
      <div class="trade">
        <b>${esc(t.my)} ↔ ${esc(t.target)}</b>
        <div class="meta">с ${esc(t.targetOwner)} · завершён</div>
        <div style="margin-top:6px">Оценка: <span class="stars" onclick="rate('${t.id}',event)">${"★".repeat(ratings[t.id]||0)}${"☆".repeat(5-(ratings[t.id]||0))}</span></div>
      </div>`).join(""):'<div class="empty">Пока нет завершённых обменов</div>';
  } else {
    box.innerHTML=`
      <p>Тема оформления:</p>
      <button class="btn light" onclick="applyTheme('light');LS.set('tradeTheme','light')">☀️ Светлая</button>
      <button class="btn light" onclick="applyTheme('dark');LS.set('tradeTheme','dark')">🌙 Тёмная</button>
      <button class="btn light" onclick="applyTheme('auto');LS.set('tradeTheme','auto')">🖥 Авто</button>
      <p style="margin-top:16px">Данные:</p>
      <button class="btn light" onclick="exportData()">⬇ Экспорт JSON</button>
      <button class="btn light" onclick="document.getElementById('importFile').click()">⬆ Импорт</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn light" onclick="if(confirm('Сбросить всё?')){localStorage.clear();location.reload()}">🗑 Сброс</button>`;
  }
}
function setTrade(id,status){
  const t=trades.find(x=>String(x.id)===String(id));if(!t)return;
  t.status=status;LS.set("tradeTrades",trades);
  toast(status==="принят"?"Обмен принят 🎉":"Обмен отклонён");
  openProfile();
}
function rate(id,e){
  const el=e.currentTarget;
  const rect=el.getBoundingClientRect();
  const val=Math.min(5,Math.max(1,Math.ceil((e.clientX-rect.left)/(rect.width/5))));
  ratings[id]=val;LS.set("tradeRatings",ratings);
  toast("Спасибо! Оценка: "+val+"★");
  ptab('done');
}
function exportData(){
  const data={items,favorites:[...favorites],trades,chatHistory,ratings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="trade-data.json";a.click();
  toast("Данные экспортированы");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(d.items)items=d.items;
    if(d.favorites)favorites=new Set(d.favorites);
    if(d.trades)trades=d.trades;
    if(d.chatHistory)chatHistory=d.chatHistory;
    if(d.ratings)ratings=d.ratings;
    LS.set("tradeItems",items);LS.set("tradeFav",[...favorites]);
    LS.set("tradeTrades",trades);LS.set("tradeChat",chatHistory);LS.set("tradeRatings",ratings);
    closeModal();render();toast("Данные загружены");
  }catch{toast("Ошибка чтения файла")}};
  r.readAsText(f);
}
